version: '3.8'

services:
  # Local MongoDB database for isolated evaluation and testing
  mongo:
    image: mongo:7.0
    container_name: irop-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - irop-network

  # Express + Node.js API Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: irop-server
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - NODE_ENV=development
      # Default: connects to containerized mongo service.
      # To use MongoDB Atlas instead, comment out the line below and set MONGODB_URI to your Atlas connection string in server/.env
      - MONGODB_URI=mongodb://mongo:27017/irop_dev
      - JWT_SECRET=irop-super-secure-production-ready-jwt-secret-key-32chars
      - JWT_EXPIRES_IN=1d
      - CLIENT_ORIGIN=http://localhost:8080
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:5000/health']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - irop-network

  # React Frontend served via unprivileged Nginx
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:5000
    container_name: irop-client
    restart: unless-stopped
    ports:
      - '8080:8080'
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:8080/']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - irop-network

volumes:
  mongo-data:
    driver: local

networks:
  irop-network:
    driver: bridge
